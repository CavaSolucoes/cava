<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanças do Casal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#151B2C; --paper:#FAF7F2; --card:#FFFFFF;
  --line:#E7E1D6; --muted:#6B7280; --text:#1B1F2A;
  --lucas:#C98A3E; --sara:#B5677A; --casal:#3E7A6D;
  --ok:#3E7A6D; --warn:#C98A3E; --bad:#B5424A;
  --r:16px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#12161F; --card:#1A2030; --line:#2A3142; --muted:#8A93A6; --text:#EDEFF4; }
}
:root[data-theme="dark"]{ --paper:#12161F; --card:#1A2030; --line:#2A3142; --muted:#8A93A6; --text:#EDEFF4; }
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{ margin:0; height:100%; background:var(--paper); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
.num{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}
header.top{ position:sticky;top:0;z-index:5;background:var(--ink);color:#fff; padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px; }
header.top .toprow{display:flex;align-items:center;justify-content:space-between;}
header.top h1{margin:0;font-size:17px;font-weight:600;}
header.top .who{font-size:12px;color:rgba(255,255,255,.75);}
header.top .who button{background:none;border:none;color:rgba(255,255,255,.75);font-size:11.5px;text-decoration:underline;padding:0;margin-left:8px;}
.month-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:8px;}
.month-row button{background:rgba(255,255,255,.12);border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:15px;}
.month-row span{font-size:14px;color:rgba(255,255,255,.85);min-width:120px;text-align:center;}
main{flex:1;padding:14px 14px 90px;}
.screen{display:none;}
.screen.active{display:block;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;}
.card .lbl{font-size:12px;color:var(--muted);margin:0 0 6px;}
.card .val{font-size:19px;font-weight:600;margin:0;}
.card.wide{grid-column:1/-1;}
h2.section{font-size:14px;font-weight:600;margin:22px 0 10px;color:var(--muted);}
.budget-row{margin-bottom:12px;}
.budget-row .brow-top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px;}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;}
.bar > div{height:100%;border-radius:4px;}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:16px;}
.search input{border:none;background:transparent;outline:none;flex:1;font-size:14px;color:var(--text);}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;border:none;width:56px;height:56px;border-radius:50%;font-size:26px;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:6;}
nav.bottom{ position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;max-width:480px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6; }
nav.bottom button{flex:1;background:none;border:none;padding:9px 0 8px;color:var(--muted);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;}
nav.bottom button.active{color:var(--ink);}
nav.bottom .ic{font-size:19px;}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:10px;}
.list-item:last-child{border-bottom:none;}
.li-left{display:flex;flex-direction:column;gap:2px;min-width:0;}
.li-desc{font-size:14.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.li-meta{font-size:12px;color:var(--muted);}
.li-val{font-size:14.5px;font-weight:600;white-space:nowrap;}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:12.5px;color:var(--text);white-space:nowrap;}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
.chips::-webkit-scrollbar{display:none;}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;}
label{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 6px;}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-size:15px;}
.seg{display:flex;gap:8px;}
.seg button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:13.5px;}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.primary-btn{width:100%;background:var(--ink);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15.5px;font-weight:600;margin-top:22px;}
.ghost-btn{width:100%;background:none;color:var(--muted);border:none;padding:10px;font-size:13.5px;margin-top:8px;}
.alert{border-radius:12px;padding:11px 14px;font-size:13px;margin-bottom:10px;}
.alert.warn{background:rgba(201,138,62,.14);color:var(--warn);}
.alert.bad{background:rgba(181,66,74,.14);color:var(--bad);}
.small-icon-btn{background:none;border:none;color:var(--muted);font-size:16px;padding:4px 6px;}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;}
.modal-back.hide{display:none;}
.modal{background:var(--paper);width:100%;max-width:480px;margin:0 auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;}
.modal h3{margin:0 0 4px;font-size:17px;}
.loginwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;padding:20px;}
.loginwrap .avatar{width:64px;height:64px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:2px;}
.loginbox{width:100%;max-width:300px;}
.err{color:var(--bad);font-size:12.5px;margin-top:8px;text-align:center;}
.bar-chart{display:flex;align-items:flex-end;gap:14px;height:120px;padding:10px 0 0;}
.bar-chart .bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;}
.bar-chart .bc .b{width:100%;border-radius:8px 8px 0 0;}
.bar-chart .bc .lb{font-size:11.5px;color:var(--muted);}
.catbar{display:flex;justify-content:space-between;font-size:13px;padding:9px 0;border-bottom:1px solid var(--line);}
.catbar:last-child{border-bottom:none;}
.settings-block{margin-bottom:20px;}
.settings-block h4{font-size:13px;color:var(--muted);margin:0 0 8px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.syncdot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:5px;}
</style>
</head>
<body>
<div id="app"><div style="padding:40px;text-align:center;color:#888;">Carregando…</div></div>

<script>
/* =========================================================
   CONFIG — preencha com os dados do SEU projeto Supabase
   (Project Settings > API no painel do Supabase)
========================================================= */
const SUPABASE_URL = 'SUA_URL_DO_PROJETO_AQUI';       // ex: https://xxxxx.supabase.co
const SUPABASE_ANON_KEY = 'SUA_CHAVE_ANON_PUBLICA_AQUI'; // a "anon public" key, nunca a service_role

const sb = (SUPABASE_URL.startsWith('http')) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* =========================================================
   HELPERS
========================================================= */
const MONTH_NAMES = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
function brl(n){ return "R$ " + (Math.round(n*100)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function pad2(n){ return String(n).padStart(2,'0'); }
function monthLabel(k){ const [y,m]=k.split('-'); return MONTH_NAMES[parseInt(m)-1]+"/"+y; }
function addMonths(k,n){ let [y,m]=k.split('-').map(Number); m=m-1+n; y+=Math.floor(m/12); m=((m%12)+12)%12; return y+'-'+pad2(m+1); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function uid(){ return crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36)+Math.random().toString(36).slice(2)); }

/* ---- BILLING MODULE ---- */
// Regra do ciclo do cartão: compra até o dia de fechamento (inclusive) entra
// na fatura do mês da compra; depois do fechamento, entra na fatura seguinte.
function calculateBillingMonth(dateStr, closingDay){
  let [y,m,d] = dateStr.split('-').map(Number);
  if(d > closingDay){ m += 1; if(m>12){ m=1; y+=1; } }
  return y+'-'+pad2(m);
}
// Divide o total em N parcelas sem erro de arredondamento (sobra vai nas primeiras parcelas)
function calculateInstallments(totalAmount, n){
  const cents = Math.round(totalAmount*100);
  const base = Math.floor(cents/n);
  const remainder = cents - base*n;
  const arr = [];
  for(let i=0;i<n;i++){ arr.push((base + (i<remainder?1:0))/100); }
  return arr;
}

/* =========================================================
   STATE / CACHE
========================================================= */
let session = null;      // supabase auth session
let myProfile = null;    // {id, name}
let cache = { cards:[], categories:[], profiles:[], expenses:[] };
let state = { screen:'home', month: localStorage.getItem('fc_month') || (new Date().getFullYear()+'-'+pad2(new Date().getMonth()+1)),
              historyFilter:{person:'all',cat:'all',type:null} };

function catName(id){ const c = cache.categories.find(x=>x.id===id); return c?c.name:'—'; }
function catBudget(id){ const c = cache.categories.find(x=>x.id===id); return c?Number(c.monthly_budget):0; }
function profileName(id){ const p = cache.profiles.find(x=>x.id===id); return p?p.name:'—'; }
function expensesFor(month){ return cache.expenses.filter(e=>e.billing_month===month); }
function total(list){ return list.reduce((s,e)=>s+Number(e.installment_amount),0); }
function catSpend(month,catId){ return total(expensesFor(month).filter(e=>e.category_id===catId)); }
function typeSpend(month,type){ return total(expensesFor(month).filter(e=>e.expense_type===type)); }
function isPessoal(catId){ const n=catName(catId); return n==='Pessoal Lucas'||n==='Pessoal Sara'; }

/* =========================================================
   DB MODULE
========================================================= */
async function loadAll(){
  const [{data:cards}, {data:categories}, {data:profiles}, {data:expenses}] = await Promise.all([
    sb.from('cards').select('*').order('id'),
    sb.from('categories').select('*').order('id'),
    sb.from('profiles').select('*'),
    sb.from('expenses').select('*').order('date')
  ]);
  cache.cards = cards||[]; cache.categories = categories||[]; cache.profiles = profiles||[]; cache.expenses = expenses||[];
}
function subscribeRealtime(){
  sb.channel('expenses-realtime')
    .on('postgres_changes', {event:'*', schema:'public', table:'expenses'}, async ()=>{
      const {data} = await sb.from('expenses').select('*').order('date');
      cache.expenses = data||[];
      renderScreen();
    })
    .subscribe();
}

/* =========================================================
   EXPENSES MODULE
========================================================= */
async function createExpense({description, totalAmount, categoryId, expenseType, cardId, installments, date}){
  const card = cache.cards.find(c=>c.id===cardId) || cache.cards[0];
  const firstBillingMonth = calculateBillingMonth(date, card.closing_day);
  const amounts = calculateInstallments(totalAmount, installments);
  const groupId = uid();
  let firstId = null;
  const rows = amounts.map((amt,i)=>{
    const id = uid();
    if(i===0) firstId = id;
    return {
      id, group_id: groupId, parent_expense_id: firstId,
      date, description, total_amount: totalAmount, installment_amount: amt,
      category_id: categoryId, user_id: myProfile.id, expense_type: expenseType, card_id: card.id,
      installments, installment_number: i+1, billing_month: addMonths(firstBillingMonth, i)
    };
  });
  // corrige parent_expense_id para todas as linhas apontarem para a 1ª parcela
  rows.forEach(r=>r.parent_expense_id = firstId);
  const {error} = await sb.from('expenses').insert(rows);
  if(error) alert('Erro ao salvar: '+error.message);
}
async function updateExpenseGroup(oldGroupId, fields){
  // forma simples e segura: apaga o grupo antigo e recria com os novos dados
  await sb.from('expenses').delete().eq('group_id', oldGroupId);
  await createExpense(fields);
}
async function deleteExpenseGroup(groupId){
  const {error} = await sb.from('expenses').delete().eq('group_id', groupId);
  if(error) alert('Erro ao excluir: '+error.message);
}
async function duplicateExpense(e){
  await createExpense({ description:e.description, totalAmount:Number(e.total_amount)/e.installments, categoryId:e.category_id,
    expenseType:e.expense_type, cardId:e.card_id, installments:1, date:e.date });
}

/* =========================================================
   AUTH MODULE
========================================================= */
async function doLogin(email,password){
  const {data, error} = await sb.auth.signInWithPassword({email, password});
  if(error) return error.message;
  session = data.session;
  const {data:prof} = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  myProfile = prof;
  localStorage.setItem('fc_theme', localStorage.getItem('fc_theme')||'');
  return null;
}
async function doLogout(){ await sb.auth.signOut(); session=null; myProfile=null; boot(); }

/* =========================================================
   RENDER — SHELL
========================================================= */
async function boot(){
  const app = document.getElementById('app');
  if(!SUPABASE_URL.startsWith('http')){
    app.innerHTML = `<div style="padding:30px;font-size:14px;line-height:1.5;">
      ⚠️ Configure <b>SUPABASE_URL</b> e <b>SUPABASE_ANON_KEY</b> no topo do arquivo antes de usar o app
      (veja o SQL/README enviados junto).</div>`;
    return;
  }
  const {data:{session:s}} = await sb.auth.getSession();
  session = s;
  if(!session){ app.innerHTML = loginHTML(); attachLogin(); return; }
  const {data:prof} = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  myProfile = prof;
  if(!myProfile){ app.innerHTML = `<div style="padding:30px;font-size:14px;">Login ok, mas não achei um perfil (tabela <b>profiles</b>) para este usuário. Veja o passo "criar Lucas e Sara" no README.</div>`; return; }
  await loadAll();
  subscribeRealtime();
  render();
}

function loginHTML(){
  return `<div class="loginwrap">
    <div class="avatar">💰</div>
    <h2 style="margin:0;">Finanças do Casal</h2>
    <div class="loginbox">
      <label>E-mail</label><input id="lEmail" type="email" placeholder="voce@exemplo.com">
      <label>Senha</label><input id="lPass" type="password" placeholder="••••••••">
      <button class="primary-btn" id="lBtn">Entrar</button>
      <p class="err" id="lErr"></p>
    </div>
  </div>`;
}
function attachLogin(){
  document.getElementById('lBtn').onclick = async ()=>{
    const email = document.getElementById('lEmail').value.trim();
    const pass = document.getElementById('lPass').value;
    const errEl = document.getElementById('lErr');
    errEl.textContent = 'Entrando...';
    const err = await doLogin(email,pass);
    if(err){ errEl.textContent = err; return; }
    await loadAll(); subscribeRealtime(); render();
  };
}

function shellHTML(){
  return `
  <header class="top">
    <div class="toprow">
      <h1>💰 Finanças do Casal</h1>
      <span class="who"><span class="syncdot"></span>${myProfile.name} <button id="logoutBtn">Sair</button></span>
    </div>
    <div class="month-row">
      <button id="mprev">‹</button><span>${monthLabel(state.month)}</span><button id="mnext">›</button>
    </div>
  </header>
  <main>
    <div class="screen" id="scr-home"></div>
    <div class="screen" id="scr-fatura"></div>
    <div class="screen" id="scr-analise"></div>
    <div class="screen" id="scr-config"></div>
  </main>
  <button class="fab" id="fabAdd">+</button>
  <nav class="bottom">
    <button data-s="home"><span class="ic">🏠</span>Início</button>
    <button data-s="fatura"><span class="ic">💳</span>Fatura</button>
    <button data-s="add"><span class="ic">➕</span>Nova</button>
    <button data-s="analise"><span class="ic">📊</span>Análise</button>
    <button data-s="config"><span class="ic">⚙️</span>Config</button>
  </nav>
  <div class="modal-back hide" id="modalBack"><div class="modal" id="modalBody"></div></div>
  `;
}
function render(){
  document.getElementById('app').innerHTML = shellHTML();
  renderScreen();
  document.getElementById('mprev').onclick=()=>{ state.month=addMonths(state.month,-1); localStorage.setItem('fc_month',state.month); render(); };
  document.getElementById('mnext').onclick=()=>{ state.month=addMonths(state.month,1); localStorage.setItem('fc_month',state.month); render(); };
  document.getElementById('fabAdd').onclick=openAddModal;
  document.getElementById('logoutBtn').onclick=doLogout;
  document.querySelectorAll('nav.bottom button').forEach(b=>{
    if(b.dataset.s==='add'){ b.onclick=openAddModal; return; }
    b.onclick=()=>{ state.screen=b.dataset.s; render(); };
  });
  document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('active', b.dataset.s===state.screen));
  document.getElementById('modalBack').onclick=(e)=>{ if(e.target.id==='modalBack') closeModal(); };
}
function closeModal(){ document.getElementById('modalBack').classList.add('hide'); document.getElementById('modalBody').innerHTML=''; }
function renderScreen(){
  ['home','fatura','analise','config'].forEach(s=>document.getElementById('scr-'+s)?.classList.toggle('active', s===state.screen));
  if(state.screen==='home') renderHome();
  if(state.screen==='fatura') renderFatura();
  if(state.screen==='analise') renderAnalise();
  if(state.screen==='config') renderConfig();
}

/* ---------- HOME ---------- */
function renderHome(){
  const m = state.month;
  const faturaTotal = total(expensesFor(m));
  const casal = typeSpend(m,'casal'), lucas = typeSpend(m,'lucas'), sara = typeSpend(m,'sara');
  const alerts = [];
  cache.categories.forEach(c=>{
    const b = Number(c.monthly_budget); if(!b) return;
    const g = catSpend(m,c.id);
    if(g>b) alerts.push({t:'bad', msg:`🔴 ${c.name} ultrapassou o orçamento em ${brl(g-b)}.`});
    else if(g/b>=0.8) alerts.push({t:'warn', msg:`⚠️ ${c.name} já consumiu ${Math.round(g/b*100)}% do orçamento.`});
  });
  const futureInstall = cache.expenses.filter(e=>e.billing_month>m && e.installments>1).reduce((s,e)=>s+Number(e.installment_amount),0);
  if(futureInstall>0) alerts.push({t:'warn', msg:`⚠️ Vocês têm ${brl(futureInstall)} em compras parceladas futuras.`});

  document.getElementById('scr-home').innerHTML = `
  <div class="search"><span>🔎</span><input id="searchBox" placeholder="Pesquisar despesas (mercado, TV, Lucas...)"></div>
  <div id="searchResults"></div>
  <div class="grid2">
    <div class="card"><p class="lbl">Fatura atual</p><p class="val num">${brl(faturaTotal)}</p></div>
    <div class="card"><p class="lbl">🟢 Gastos do casal</p><p class="val num" style="color:var(--casal)">${brl(casal)}</p></div>
    <div class="card"><p class="lbl">🔵 Lucas</p><p class="val num" style="color:var(--lucas)">${brl(lucas)}</p></div>
    <div class="card"><p class="lbl">🟣 Sara</p><p class="val num" style="color:var(--sara)">${brl(sara)}</p></div>
  </div>
  ${alerts.map(a=>`<div class="alert ${a.t}">${a.msg}</div>`).join('')}
  <h2 class="section">Orçamento do mês</h2>
  ${cache.categories.filter(c=>Number(c.monthly_budget)>0).map(c=>{
    const b=Number(c.monthly_budget), g=catSpend(m,c.id), pct=Math.min(100,Math.round(g/b*100));
    const color = g>b?'var(--bad)':(pct>=80?'var(--warn)':'var(--ok)');
    return `<div class="budget-row"><div class="brow-top"><span>${c.name}</span><span>${brl(g)} / ${brl(b)}</span></div>
      <div class="bar"><div style="width:${pct}%;background:${color}"></div></div></div>`;
  }).join('')}
  `;
  document.getElementById('searchBox').oninput = (e)=>{
    const q = e.target.value.trim().toLowerCase();
    const box = document.getElementById('searchResults');
    if(!q){ box.innerHTML=''; return; }
    const results = cache.expenses.filter(ex => (ex.description+catName(ex.category_id)+ex.expense_type).toLowerCase().includes(q)).slice(0,15);
    box.innerHTML = results.length ? results.map(listItemHTML).join('') : `<p style="color:var(--muted);font-size:13px;">Nada encontrado.</p>`;
  };
}

/* ---------- shared list item ---------- */
function typeColor(t){ return t==='lucas'?'var(--lucas)':t==='sara'?'var(--sara)':'var(--casal)'; }
function typeLabel(t){ return t==='lucas'?'Lucas':t==='sara'?'Sara':'Casal'; }
function listItemHTML(e){
  const parcela = e.installments>1 ? `${e.installment_number}/${e.installments}` : 'à vista';
  return `<div class="list-item">
    <div class="li-left">
      <span class="li-desc"><span class="dot" style="background:${typeColor(e.expense_type)}"></span>${e.description}</span>
      <span class="li-meta">${e.date.split('-').reverse().join('/')} · ${catName(e.category_id)} · ${typeLabel(e.expense_type)} · registrado por ${profileName(e.user_id)} · ${parcela}</span>
    </div>
    <div style="text-align:right;">
      <div class="li-val">${brl(e.installment_amount)}</div>
      <div><button class="small-icon-btn" onclick='editExpense(${JSON.stringify(e.group_id)})'>✏️</button><button class="small-icon-btn" onclick='dupExpense(${JSON.stringify(e.id)})'>📄</button><button class="small-icon-btn" onclick='delExpense(${JSON.stringify(e.group_id)})'>🗑️</button></div>
    </div>
  </div>`;
}
function editExpense(groupId){ const e = cache.expenses.find(x=>x.group_id===groupId); openExpenseModal(e); }
function dupExpense(id){ const e = cache.expenses.find(x=>x.id===id); if(e) duplicateExpense(e); }
async function delExpense(groupId){ if(confirm('Excluir esta despesa (todas as parcelas)?')) await deleteExpenseGroup(groupId); }

/* ---------- FATURA ---------- */
function renderFatura(){
  const m = state.month;
  let list = expensesFor(m);
  const f = state.historyFilter;
  if(f.person!=='all') list = list.filter(e=>e.expense_type===f.person);
  if(f.cat!=='all') list = list.filter(e=>e.category_id===Number(f.cat));
  if(f.type==='parcelado') list = list.filter(e=>e.installments>1);
  if(f.type==='avista') list = list.filter(e=>e.installments===1);
  list = list.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const casal = typeSpend(m,'casal'), lucas = typeSpend(m,'lucas'), sara = typeSpend(m,'sara');
  const nexts = [1,2,3,4,5,6].map(i=>addMonths(m,i));

  document.getElementById('scr-fatura').innerHTML = `
  <div class="grid3">
    <div class="card"><p class="lbl">Casal</p><p class="val num" style="color:var(--casal)">${brl(casal)}</p></div>
    <div class="card"><p class="lbl">Lucas</p><p class="val num" style="color:var(--lucas)">${brl(lucas)}</p></div>
    <div class="card"><p class="lbl">Sara</p><p class="val num" style="color:var(--sara)">${brl(sara)}</p></div>
  </div>
  <div class="chips">
    <span class="chip ${f.person==='all'?'on':''}" data-fp="all">Todos</span>
    <span class="chip ${f.person==='casal'?'on':''}" data-fp="casal">Casal</span>
    <span class="chip ${f.person==='lucas'?'on':''}" data-fp="lucas">Lucas</span>
    <span class="chip ${f.person==='sara'?'on':''}" data-fp="sara">Sara</span>
    <span class="chip ${f.type==='parcelado'?'on':''}" data-ft="parcelado">Parceladas</span>
    <span class="chip ${f.type==='avista'?'on':''}" data-ft="avista">À vista</span>
  </div>
  <select id="catFilter" style="margin-bottom:14px;">
    <option value="all">Todas as categorias</option>
    ${cache.categories.map(c=>`<option value="${c.id}" ${f.cat==String(c.id)?'selected':''}>${c.name}</option>`).join('')}
  </select>
  <h2 class="section">Lançamentos — ${monthLabel(m)}</h2>
  ${list.length? list.map(listItemHTML).join('') : `<p style="color:var(--muted);font-size:13px;">Nenhuma despesa nesta fatura.</p>`}
  <h2 class="section">📅 Compromissos futuros</h2>
  ${nexts.map(nm=>`<div class="catbar"><span>${monthLabel(nm)}</span><span class="num" style="font-weight:600">${brl(total(expensesFor(nm)))}</span></div>`).join('')}
  `;
  document.querySelectorAll('[data-fp]').forEach(c=>c.onclick=()=>{ state.historyFilter.person=c.dataset.fp; renderFatura(); });
  document.querySelectorAll('[data-ft]').forEach(c=>c.onclick=()=>{ state.historyFilter.type=(state.historyFilter.type===c.dataset.ft)?null:c.dataset.ft; renderFatura(); });
  document.getElementById('catFilter').onchange=(e)=>{ state.historyFilter.cat=e.target.value; renderFatura(); };
}

/* ---------- ANALISE ---------- */
function renderAnalise(){
  const m = state.month;
  const lucas = typeSpend(m,'lucas'), sara = typeSpend(m,'sara'), casal = typeSpend(m,'casal');
  const maxv = Math.max(lucas,sara,casal,1);
  const catTotals = cache.categories.map(c=>({c, v:catSpend(m,c.id)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const maxc = Math.max(...catTotals.map(x=>x.v),1);
  document.getElementById('scr-analise').innerHTML = `
  <h2 class="section">👥 Distribuição por pessoa — ${monthLabel(m)}</h2>
  <div class="card wide"><div class="bar-chart">
    <div class="bc"><div class="b" style="height:${casal/maxv*90+10}px;background:var(--casal)"></div><div class="lb">Casal<br><b>${brl(casal)}</b></div></div>
    <div class="bc"><div class="b" style="height:${lucas/maxv*90+10}px;background:var(--lucas)"></div><div class="lb">Lucas<br><b>${brl(lucas)}</b></div></div>
    <div class="bc"><div class="b" style="height:${sara/maxv*90+10}px;background:var(--sara)"></div><div class="lb">Sara<br><b>${brl(sara)}</b></div></div>
  </div></div>
  <h2 class="section">📊 Por categoria</h2>
  <div class="card wide">
    ${catTotals.map(x=>`
      <div class="catbar" style="cursor:pointer;" onclick="filterByCat(${x.c.id})"><span>${x.c.name}</span><span class="num" style="font-weight:600">${brl(x.v)}</span></div>
      <div class="bar" style="margin-bottom:4px;"><div style="width:${x.v/maxc*100}%;background:var(--casal)"></div></div>
    `).join('') || `<p style="color:var(--muted);font-size:13px;">Sem dados neste mês.</p>`}
  </div>`;
}
function filterByCat(catId){ state.historyFilter={person:'all',cat:String(catId),type:null}; state.screen='fatura'; render(); }

/* ---------- CONFIG ---------- */
function renderConfig(){
  const card = cache.cards[0];
  document.getElementById('scr-config').innerHTML = `
  <div class="settings-block"><h4>Usuário conectado</h4><p style="font-size:15px;font-weight:600;">${myProfile.name}</p></div>
  <div class="settings-block">
    <h4>Cartão</h4>
    <label>Nome</label><input id="cardName" value="${card.name}">
    <div class="row2"><div><label>Limite (R$)</label><input id="cardLimit" type="number" value="${card.credit_limit}"></div>
    <div><label>Fechamento (dia)</label><input id="cardClose" type="number" value="${card.closing_day}"></div></div>
    <label>Vencimento (dia)</label><input id="cardDue" type="number" value="${card.due_day}">
    <button class="primary-btn" id="saveCardBtn">Salvar cartão</button>
  </div>
  <div class="settings-block">
    <h4>Orçamento por categoria</h4>
    ${cache.categories.map(c=>`<div class="row2" style="align-items:center;margin-bottom:8px;">
      <span style="font-size:13.5px;">${c.name}</span><input type="number" data-budgetcat="${c.id}" value="${c.monthly_budget}"></div>`).join('')}
    <button class="primary-btn" id="saveBudgetsBtn">Salvar orçamentos</button>
  </div>`;
  document.getElementById('saveCardBtn').onclick = async ()=>{
    await sb.from('cards').update({
      name: document.getElementById('cardName').value,
      credit_limit: parseFloat(document.getElementById('cardLimit').value)||0,
      closing_day: parseInt(document.getElementById('cardClose').value)||25,
      due_day: parseInt(document.getElementById('cardDue').value)||5
    }).eq('id', card.id);
    await loadAll(); render();
  };
  document.getElementById('saveBudgetsBtn').onclick = async ()=>{
    const updates = [...document.querySelectorAll('[data-budgetcat]')].map(inp=>
      sb.from('categories').update({monthly_budget: parseFloat(inp.value)||0}).eq('id', inp.dataset.budgetcat));
    await Promise.all(updates);
    await loadAll(); render();
  };
}

/* ---------- ADD / EDIT MODAL ---------- */
function openAddModal(){ openExpenseModal(null); }
function openExpenseModal(e){
  const back = document.getElementById('modalBack'); const body = document.getElementById('modalBody');
  body.innerHTML = `
    <h3>${e?'Editar despesa':'Nova despesa'}</h3>
    <label>Valor</label><input id="fAmount" type="number" step="0.01" value="${e?e.total_amount:''}" placeholder="0,00">
    <label>Descrição</label><input id="fDesc" value="${e?e.description:''}" placeholder="Ex: Mercado">
    <label>Categoria</label>
    <select id="fCat">${cache.categories.map(c=>`<option value="${c.id}" ${e&&e.category_id===c.id?'selected':''}>${c.name}</option>`).join('')}</select>
    <label>Quem está registrando?</label>
    <p style="font-size:14px;font-weight:600;margin:0;">${myProfile.name}</p>
    <label>Para quem é essa despesa?</label>
    <div class="seg" id="fType">
      <button data-t="casal" class="${(!e||e.expense_type==='casal')?'on':''}">👥 Casal</button>
      <button data-t="lucas" class="${(e&&e.expense_type==='lucas')?'on':''}">👨 Lucas</button>
      <button data-t="sara" class="${(e&&e.expense_type==='sara')?'on':''}">👩 Sara</button>
    </div>
    <label>Cartão</label>
    <select id="fCard">${cache.cards.map(c=>`<option value="${c.id}" ${e&&e.card_id===c.id?'selected':''}>${c.name}</option>`).join('')}</select>
    <label>Tipo</label>
    <div class="seg" id="fTipo">
      <button data-t="avista" class="${(!e||e.installments<=1)?'on':''}">À vista</button>
      <button data-t="parcelado" class="${(e&&e.installments>1)?'on':''}">Parcelado</button>
    </div>
    <div id="fParcelasWrap" style="display:${(e&&e.installments>1)?'block':'none'};">
      <label>Quantidade de parcelas</label><input id="fParcelas" type="number" min="2" value="${e&&e.installments>1?e.installments:2}">
      <p id="fParcelaPreview" style="font-size:12.5px;color:var(--muted);margin:6px 0 0;"></p>
    </div>
    <label>Data</label><input id="fData" type="date" value="${e?e.date:todayISO()}">
    <button class="primary-btn" id="fSave">Salvar despesa</button>
    ${e?`<button class="ghost-btn" id="fDelete" style="color:var(--bad);">Excluir despesa</button>`:''}
  `;
  back.classList.remove('hide');
  document.querySelectorAll('#fType button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#fType button').forEach(x=>x.classList.remove('on'));b.classList.add('on');});
  document.querySelectorAll('#fTipo button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#fTipo button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    document.getElementById('fParcelasWrap').style.display = b.dataset.t==='parcelado'?'block':'none'; updatePreview();
  });
  document.getElementById('fAmount').oninput = updatePreview;
  const parcInputEl = document.getElementById('fParcelas'); if(parcInputEl) parcInputEl.oninput = updatePreview;
  function updatePreview(){
    const amt = parseFloat(document.getElementById('fAmount').value)||0;
    const tipo = document.querySelector('#fTipo button.on').dataset.t;
    const prev = document.getElementById('fParcelaPreview'); if(!prev) return;
    if(tipo==='parcelado'){
      const n = parseInt(document.getElementById('fParcelas').value)||2;
      const parts = calculateInstallments(amt,n);
      prev.textContent = `${n}x: ` + parts.map(p=>brl(p)).slice(0,3).join(', ') + (n>3?'...':'');
    }
  }
  updatePreview();
  document.getElementById('fSave').onclick = async ()=>{
    const totalAmount = parseFloat(document.getElementById('fAmount').value);
    const description = document.getElementById('fDesc').value.trim();
    if(!totalAmount || totalAmount<=0 || !description){ alert('Preencha valor e descrição.'); return; }
    const categoryId = Number(document.getElementById('fCat').value);
    const expenseType = document.querySelector('#fType button.on').dataset.t;
    const cardId = Number(document.getElementById('fCard').value);
    const tipo = document.querySelector('#fTipo button.on').dataset.t;
    const installments = tipo==='parcelado' ? (parseInt(document.getElementById('fParcelas').value)||2) : 1;
    const date = document.getElementById('fData').value || todayISO();
    const payload = {description, totalAmount, categoryId, expenseType, cardId, installments, date};
    if(e){ await updateExpenseGroup(e.group_id, payload); } else { await createExpense(payload); }
    closeModal();
  };
  const delBtn = document.getElementById('fDelete');
  if(delBtn) delBtn.onclick = async ()=>{ if(confirm('Excluir esta despesa (todas as parcelas)?')){ await deleteExpenseGroup(e.group_id); closeModal(); } };
}

boot();
</script>
</body>
